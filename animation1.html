<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forest Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f17;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
            background-color: #0b0f17;
            border: 1px dashed #00ff6622;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.05);
        }

        .player {
            position: absolute;
            left: 40px;
            top: 55px;
            width: 16px;
            height: 16px;
            border: 2px solid #00bcff;
            filter: drop-shadow(0 0 6px #00bcff);
            z-index: 10;
            animation: creepForward 0.8s ease-in-out infinite alternate;
        }

        @keyframes creepForward {
            0% {
                transform: translateX(0px) scale(0.95);
            }

            100% {
                transform: translateX(10px) scale(1.05);
            }
        }

        .tree-container {
            position: absolute;
            top: 30px;
            width: 40px;
            height: 80px;
            animation: scrollPast 4s linear infinite;
        }

        @keyframes scrollPast {
            0% {
                left: 100%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                left: -50px;
                opacity: 0;
            }
        }

        .tree-1 {
            animation-delay: 0s;
        }

        .tree-2 {
            animation-delay: 1s;
        }

        .tree-3 {
            animation-delay: 2s;
        }

        .tree-4 {
            animation-delay: 3s;
        }

        .leaf-top {
            position: absolute;
            left: 10px;
            top: 0;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #00ff66;
            filter: drop-shadow(0 0 4px #00ff66);
        }

        .leaf-bottom {
            position: absolute;
            left: 5px;
            top: 15px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid #00ff66;
            filter: drop-shadow(0 0 4px #00ff66);
        }

        .trunk {
            position: absolute;
            left: 16px;
            top: 40px;
            width: 8px;
            height: 25px;
            border: 2px solid #00ff66;
            filter: drop-shadow(0 0 4px #00ff66);
        }

        .axis-line {
            position: absolute;
            top: 63px;
            width: 100%;
            height: 1px;
            background:
                repeating-linear-gradient(
                    90deg,
                    #00ff6611,
                    #00ff6611 4px,
                    transparent 4px,
                    transparent 8px
                );
        }
    </style>
</head>

<body>

    <div class="stage">

        <div class="axis-line"></div>

        <div class="player"></div>

        <div class="tree-container tree-1">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="tree-container tree-2">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="tree-container tree-3">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="tree-container tree-4">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

    </div>

</body>
</html>
