<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forest Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f17;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
            background: #0b0f17;
            border: 1px dashed #00ff6622;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.05);
        }

        /* =========================================
           FOREST MOVEMENT
           ========================================= */

        .forest {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 140px;
        }

        .tree-row {
            position: absolute;
            left: 0;
            top: 20px;
            width: 200%;
            height: 100px;

            animation: forestMove 12s linear infinite;
        }

        @keyframes forestMove {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }

        /* =========================================
           BACKGROUND TREES
           ========================================= */

        .background-row {
            z-index: 2;
        }

        .background-tree {
            position: absolute;
            top: 0;

            width: 30px;
            height: 65px;

            opacity: 0.3;

            transform-origin: bottom center;
        }

        .background-tree .leaf-top {
            position: absolute;
            left: 8px;
            top: 0;

            width: 0;
            height: 0;

            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 17px solid #185c3a;
        }

        .background-tree .leaf-bottom {
            position: absolute;
            left: 3px;
            top: 13px;

            width: 0;
            height: 0;

            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-bottom: 22px solid #185c3a;
        }

        .background-tree .trunk {
            position: absolute;
            left: 12px;
            top: 34px;

            width: 6px;
            height: 22px;

            border: 2px solid #185c3a;
        }

        /* Background tree positions */

        .bg-1 {
            left: 0%;
            transform: scale(0.8);
        }

        .bg-2 {
            left: 5%;
            transform: scale(0.65);
        }

        .bg-3 {
            left: 10%;
            transform: scale(0.9);
        }

        .bg-4 {
            left: 15%;
            transform: scale(0.7);
        }

        .bg-5 {
            left: 20%;
            transform: scale(0.85);
        }

        .bg-6 {
            left: 25%;
            transform: scale(0.6);
        }

        .bg-7 {
            left: 30%;
            transform: scale(0.8);
        }

        .bg-8 {
            left: 35%;
            transform: scale(0.7);
        }

        .bg-9 {
            left: 40%;
            transform: scale(0.9);
        }

        .bg-10 {
            left: 45%;
            transform: scale(0.65);
        }

        .bg-11 {
            left: 50%;
            transform: scale(0.8);
        }

        .bg-12 {
            left: 55%;
            transform: scale(0.7);
        }

        .bg-13 {
            left: 60%;
            transform: scale(0.9);
        }

        .bg-14 {
            left: 65%;
            transform: scale(0.6);
        }

        .bg-15 {
            left: 70%;
            transform: scale(0.8);
        }

        .bg-16 {
            left: 75%;
            transform: scale(0.7);
        }

        .bg-17 {
            left: 80%;
            transform: scale(0.9);
        }

        .bg-18 {
            left: 85%;
            transform: scale(0.65);
        }

        .bg-19 {
            left: 90%;
            transform: scale(0.8);
        }

        .bg-20 {
            left: 95%;
            transform: scale(0.7);
        }

        /* =========================================
           SECOND BACKGROUND ROW
           ========================================= */

        .background-row-2 {
            top: 20px;
            opacity: 0.7;
            animation-duration: 15s;
        }

        .background-row-2 .background-tree {
            opacity: 0.22;
            transform: scale(0.55);
        }

        /* =========================================
           PLAYER
           ========================================= */

        .player {
            position: absolute;

            left: 40px;
            top: 55px;

            width: 16px;
            height: 16px;

            border: 2px solid #00bcff;

            filter:
                drop-shadow(0 0 6px #00bcff);

            z-index: 10;

            animation:
                creepForward 0.8s ease-in-out infinite alternate;
        }

        @keyframes creepForward {
            0% {
                transform: translateX(0) scale(0.95);
            }

            100% {
                transform: translateX(10px) scale(1.05);
            }
        }

        /* =========================================
           GROUND LINE
           ========================================= */

        .axis-line {
            position: absolute;

            top: 63px;

            width: 100%;
            height: 1px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #00ff6611,
                    #00ff6611 4px,
                    transparent 4px,
                    transparent 8px
                );

            z-index: 5;
        }

        /* =========================================
           FOREGROUND TREES
           ========================================= */

        .foreground-row {
            z-index: 20;
            top: 20px;

            animation-duration: 9s;
        }

        .foreground-tree {
            position: absolute;
            top: 0;

            width: 40px;
            height: 80px;

            transform-origin: bottom center;
        }

        .foreground-tree .leaf-top {
            position: absolute;

            left: 10px;
            top: 0;

            width: 0;
            height: 0;

            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #00ff66;

            filter:
                drop-shadow(0 0 7px #00ff66);
        }

        .foreground-tree .leaf-bottom {
            position: absolute;

            left: 5px;
            top: 15px;

            width: 0;
            height: 0;

            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid #00ff66;

            filter:
                drop-shadow(0 0 8px #00ff66);
        }

        .foreground-tree .trunk {
            position: absolute;

            left: 16px;
            top: 40px;

            width: 8px;
            height: 25px;

            border: 2px solid #00ff66;

            filter:
                drop-shadow(0 0 7px #00ff66);
        }

        .fg-1 {
            left: 8%;
            transform: scale(1.2);
        }

        .fg-2 {

        }

        .fg-3 {

        }

        .fg-4 {
            left: 68%;

        }

        .fg-5 {
            left: 88%;
            transform: scale(1.15);
        }

        /* =========================================
           DUPLICATE FOREGROUND ROW
           Keeps the movement continuous
           ========================================= */

        .foreground-row-2 {
            left: 100%;
        }
    </style>
</head>
