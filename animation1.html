<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forest Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f17;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
            background: #0b0f17;
            border: 1px dashed #00ff6622;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.05);
        }

        /* ========================================
           BACKGROUND FOREST
           ======================================== */

        .background-forest {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .background-tree {
            position: absolute;
            width: 40px;
            height: 80px;
            opacity: 0.28;
        }

        .background-tree .leaf-top {
            filter: none;
        }

        .background-tree .leaf-bottom {
            filter: none;
        }

        .background-tree .trunk {
            filter: none;
        }

        .background-tree-1 {
            left: 8%;
            top: 8px;
            transform: scale(0.75);
        }

        .background-tree-2 {
            left: 23%;
            top: 25px;
            transform: scale(0.55);
        }

        .background-tree-3 {
            left: 39%;
            top: 0;
            transform: scale(0.9);
        }

        .background-tree-4 {
            left: 55%;
            top: 20px;
            transform: scale(0.65);
        }

        .background-tree-5 {
            left: 70%;
            top: 3px;
            transform: scale(0.8);
        }

        .background-tree-6 {
            left: 86%;
            top: 22px;
            transform: scale(0.6);
        }

        .background-tree .leaf-top {
            border-bottom-color: #087a3b;
        }

        .background-tree .leaf-bottom {
            border-bottom-color: #087a3b;
        }

        .background-tree .trunk {
            border-color: #087a3b;
        }

        /* ========================================
           PLAYER
           ======================================== */

        .player {
            position: absolute;
            left: 40px;
            top: 55px;

            width: 16px;
            height: 16px;

            border: 2px solid #00bcff;

            filter:
                drop-shadow(0 0 6px #00bcff);

            z-index: 10;

            animation:
                creepForward 0.8s ease-in-out infinite alternate;
        }

        @keyframes creepForward {
            0% {
                transform: translateX(0px) scale(0.95);
            }

            100% {
                transform: translateX(10px) scale(1.05);
            }
        }

        /* ========================================
           GROUND LINE
           ======================================== */

        .axis-line {
            position: absolute;

            top: 63px;

            width: 100%;
            height: 1px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #00ff6611,
                    #00ff6611 4px,
                    transparent 4px,
                    transparent 8px
                );

            z-index: 5;
        }

        /* ========================================
           FOREGROUND TREES
           ======================================== */

        .foreground-tree {
            position: absolute;

            top: 30px;

            width: 40px;
            height: 80px;

            z-index: 20;

            animation:
                scrollPast 4.5s linear infinite;
        }

        @keyframes scrollPast {
            0% {
                left: 100%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                left: -50px;
                opacity: 0;
            }
        }

        .foreground-tree-1 {
            top: 30px;
            transform: scale(1.15);
            animation-delay: 0s;
        }

        .foreground-tree-2 {
            top: 45px;
            transform: scale(0.9);
            animation-delay: 1.7s;
        }

        .foreground-tree-3 {
            top: 20px;
            transform: scale(1.3);
            animation-delay: 3.4s;
        }

        .foreground-tree-4 {
            top: 38px;
            transform: scale(1);
            animation-delay: 5.1s;
        }

        /* Bright glow for foreground trees */

        .foreground-tree .leaf-top {
            filter:
                drop-shadow(0 0 7px #00ff66)
                drop-shadow(0 0 3px #00ff66);
        }

        .foreground-tree .leaf-bottom {
            filter:
                drop-shadow(0 0 8px #00ff66)
                drop-shadow(0 0 3px #00ff66);
        }

        .foreground-tree .trunk {
            filter:
                drop-shadow(0 0 7px #00ff66);
        }

        /* ========================================
           TREE PARTS
           ======================================== */

        .leaf-top {
            position: absolute;

            left: 10px;
            top: 0;

            width: 0;
            height: 0;

            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #00ff66;
        }

        .leaf-bottom {
            position: absolute;

            left: 5px;
            top: 15px;

            width: 0;
            height: 0;

            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid #00ff66;
        }

        .trunk {
            position: absolute;

            left: 16px;
            top: 40px;

            width: 8px;
            height: 25px;

            border: 2px solid #00ff66;
        }
    </style>
</head>

<body>

    <div class="stage">

        <!-- ==================================
             CONSTANT BACKGROUND FOREST
             ================================== -->

        <div class="background-forest">

            <div class="background-tree background-tree-1">
                <div class="leaf-top"></div>
                <div class="leaf-bottom"></div>
                <div class="trunk"></div>
            </div>

            <div class="background-tree background-tree-2">
                <div class="leaf-top"></div>
                <div class="leaf-bottom"></div>
                <div class="trunk"></div>
            </div>

            <div class="background-tree background-tree-3">
                <div class="leaf-top"></div>
                <div class="leaf-bottom"></div>
                <div class="trunk"></div>
            </div>

            <div class="background-tree background-tree-4">
                <div class="leaf-top"></div>
                <div class="leaf-bottom"></div>
                <div class="trunk"></div>
            </div>

            <div class="background-tree background-tree-5">
                <div class="leaf-top"></div>
                <div class="leaf-bottom"></div>
                <div class="trunk"></div>
            </div>

            <div class="background-tree background-tree-6">
                <div class="leaf-top"></div>
                <div class="leaf-bottom"></div>
                <div class="trunk"></div>
            </div>

        </div>


        <!-- Ground line -->

        <div class="axis-line"></div>


        <!-- Player -->

        <div class="player"></div>


        <!-- ==================================
             BRIGHT FOREGROUND TREES
             ================================== -->

        <div class="foreground-tree foreground-tree-1">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="foreground-tree foreground-tree-2">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="foreground-tree foreground-tree-3">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="foreground-tree foreground-tree-4">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

    </div>

</body>
</html>
