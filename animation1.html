<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Animation</title>

    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f17;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
            background: #0b0f17;
            border: 1px dashed #00ff6622;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.05);
        }

        /* Lots of smaller, dimmer trees fill the background. */
        .background-forest {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
        }

        .background-tree {
            position: absolute;
            width: 30px;
            height: 65px;
            opacity: 0.52;
            transform-origin: bottom center;
        }

        .background-tree .leaf-top,
        .background-tree .leaf-bottom,
        .background-tree .trunk,
        .foreground-tree .leaf-top,
        .foreground-tree .leaf-bottom,
        .foreground-tree .trunk {
            position: absolute;
        }

        .background-tree .leaf-top {
            left: 8px;
            top: 0;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 17px solid #258f58;
            filter: drop-shadow(0 0 3px #258f58);
        }

        .background-tree .leaf-bottom {
            left: 3px;
            top: 13px;
            width: 0;
            height: 0;
            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-bottom: 22px solid #258f58;
            filter: drop-shadow(0 0 3px #258f58);
        }

        .background-tree .trunk {
            left: 12px;
            top: 34px;
            width: 6px;
            height: 22px;
            border: 2px solid #258f58;
        }

        /* Slightly different heights and sizes make the background feel deep. */
        .background-tree:nth-child(3n) { opacity: 0.42; }
        .background-tree:nth-child(4n) { opacity: 0.58; }
        .background-tree:nth-child(5n) { filter: blur(0.3px); }

        .background-row-back .background-tree { top: -8px; }
        .background-row-front .background-tree { top: 38px; }

        .axis-line {
            position: absolute;
            top: 63px;
            z-index: 5;
            width: 100%;
            height: 1px;
            background: repeating-linear-gradient(
                90deg,
                #00ff6611 0 4px,
                transparent 4px 8px
            );
        }

        .player {
            position: absolute;
            left: 40px;
            top: 55px;
            z-index: 10;
            width: 16px;
            height: 16px;
            border: 2px solid #00bcff;
            filter: drop-shadow(0 0 6px #00bcff);
            animation: creepForward 0.8s ease-in-out infinite alternate;
        }

        @keyframes creepForward {
            from { transform: translateX(0) scale(0.95); }
            to { transform: translateX(10px) scale(1.05); }
        }

        /* Only a few bright trees move through the foreground. */
        .foreground-tree {
            position: absolute;
            top: 30px;
            z-index: 20;
            width: 40px;
            height: 80px;
            animation: scrollPast 4.5s linear infinite;
        }

        @keyframes scrollPast {
            0% { left: 100%; opacity: 0; }
            10%, 90% { opacity: 1; }
            100% { left: -50px; opacity: 0; }
        }

        .foreground-tree:nth-of-type(1) { animation-delay: 0s; top: 30px; transform: scale(1.15); }
        .foreground-tree:nth-of-type(2) { animation-delay: 1.8s; top: 43px; transform: scale(0.9); }
        .foreground-tree:nth-of-type(3) { animation-delay: 3.6s; top: 20px; transform: scale(1.3); }

        .foreground-tree .leaf-top {
            left: 10px;
            top: 0;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #00ff66;
            filter: drop-shadow(0 0 7px #00ff66);
        }

        .foreground-tree .leaf-bottom {
            left: 5px;
            top: 15px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid #00ff66;
            filter: drop-shadow(0 0 8px #00ff66);
        }

        .foreground-tree .trunk {
            left: 16px;
            top: 40px;
            width: 8px;
            height: 25px;
            border: 2px solid #00ff66;
            filter: drop-shadow(0 0 7px #00ff66);
        }

        @media (prefers-reduced-motion: reduce) {
            .player, .foreground-tree { animation-play-state: paused; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="background-forest" aria-hidden="true">
            <div class="background-row-back"></div>
            <div class="background-row-front"></div>
        </div>

        <div class="axis-line"></div>
        <div class="player" aria-label="Player"></div>

        <div class="foreground-tree">
            <div class="leaf-top"></div><div class="leaf-bottom"></div><div class="trunk"></div>
        </div>
        <div class="foreground-tree">
            <div class="leaf-top"></div><div class="leaf-bottom"></div><div class="trunk"></div>
        </div>
        <div class="foreground-tree">
            <div class="leaf-top"></div><div class="leaf-bottom"></div><div class="trunk"></div>
        </div>
    </div>

    <script>
        // Build two dense background rows so the foreground stays uncluttered.
        const treeMarkup = '<div class="background-tree"><div class="leaf-top"></div><div class="leaf-bottom"></div><div class="trunk"></div></div>';
        const backRow = document.querySelector('.background-row-back');
        const frontRow = document.querySelector('.background-row-front');

        for (let i = 0; i < 30; i++) {
            const tree = document.createElement('div');
            tree.innerHTML = treeMarkup;
            const item = tree.firstElementChild;
            item.style.left = `${i * 3.5 - 2}%`;
            item.style.transform = `scale(${0.55 + (i % 5) * 0.1})`;
            backRow.appendChild(item);
        }

        for (let i = 0; i < 24; i++) {
            const tree = document.createElement('div');
            tree.innerHTML = treeMarkup;
            const item = tree.firstElementChild;
            item.style.left = `${i * 4.5 - 3}%`;
            item.style.transform = `scale(${0.7 + (i % 4) * 0.1})`;
            frontRow.appendChild(item);
        }
    </script>
</body>
</html>
