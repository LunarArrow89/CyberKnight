<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forest Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f17;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
            background: #0b0f17;
            border: 1px dashed #00ff6622;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.05);
        }

        /* =========================================
           DENSE BACKGROUND FOREST
           ========================================= */

        .background-forest {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
        }

        .background-tree {
            position: absolute;
            width: 30px;
            height: 65px;
            opacity: 0.3;
        }

        .background-tree .leaf-top {
            position: absolute;
            left: 8px;
            top: 0;

            width: 0;
            height: 0;

            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 17px solid #185c3a;
        }

        .background-tree .leaf-bottom {
            position: absolute;
            left: 3px;
            top: 13px;

            width: 0;
            height: 0;

            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-bottom: 22px solid #185c3a;
        }

        .background-tree .trunk {
            position: absolute;
            left: 12px;
            top: 34px;

            width: 6px;
            height: 22px;

            border: 2px solid #185c3a;
        }

        /* =========================================
           BACK ROW
           ========================================= */

        .tree-b1 {
            left: -10px;

            transform: scale(0.8);
        }

        /* =========================================
           PLAYER
           ========================================= */

        .player {
            position: absolute;
            left: 40px;
            top: 55px;

            width: 16px;
            height: 16px;

            border: 2px solid #00bcff;

            filter: drop-shadow(0 0 6px #00bcff);

            z-index: 10;

            animation:
                creepForward 0.8s ease-in-out infinite alternate;
        }

        @keyframes creepForward {
            0% {
                transform: translateX(0px) scale(0.95);
            }

            100% {
                transform: translateX(10px) scale(1.05);
            }
        }

        /* =========================================
           GROUND LINE
           ========================================= */

        .axis-line {
            position: absolute;
            top: 63px;

            width: 100%;
            height: 1px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #00ff6611,
                    #00ff6611 4px,
                    transparent 4px,
                    transparent 8px
                );

            z-index: 5;
        }

        /* =========================================
           FOREGROUND TREES
           ========================================= */

        .foreground-tree {
            position: absolute;

            width: 40px;
            height: 80px;

            z-index: 20;

            animation:
                scrollPast 4.5s linear infinite;
        }

        @keyframes scrollPast {
            0% {
                left: 100%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                left: -50px;
                opacity: 0;
            }
        }

        .foreground-tree-1 {
            top: 30px;
            transform: scale(1.15);
            animation-delay: 0s;
        }

        .foreground-tree-2 {
            top: 45px;
            transform: scale(0.9);
            animation-delay: 1.7s;
        }

        .foreground-tree-3 {
            top: 20px;
            transform: scale(1.3);
            animation-delay: 3.4s;
        }

        .foreground-tree-4 {
            top: 38px;
            transform: scale(1);
            animation-delay: 5.1s;
        }

        .foreground-tree .leaf-top {
            filter:
                drop-shadow(0 0 7px #00ff66)
                drop-shadow(0 0 3px #00ff66);
        }

        .foreground-tree .leaf-bottom {
            filter:
                drop-shadow(0 0 8px #00ff66)
                drop-shadow(0 0 3px #00ff66);
        }

        .foreground-tree .trunk {
            filter:
                drop-shadow(0 0 7px #00ff66);
        }

        /* =========================================
           FOREGROUND TREE PARTS
           ========================================= */

        .foreground-tree .leaf-top {
            position: absolute;
            left: 10px;
            top: 0;

            width: 0;
            height: 0;

            border-left: 10px solid transparent;
            border-right: 10px solid transparent;

            height: 0;

        .foreground-tree .trunk {
            position: absolute;
            left: 16px;
            top: 40px;

            width: 8px;
            height: 25px;

            border: 2px solid #00ff66;
        }
    </style>
</head>
