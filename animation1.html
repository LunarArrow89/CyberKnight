<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forest Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f17;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
            background-color: #0b0f17;
            border: 1px dashed #00ff6622;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.05);
        }

        /* =========================
           PLAYER
           ========================= */

        .player {
            position: absolute;
            left: 40px;
            top: 55px;
            width: 16px;
            height: 16px;
            border: 2px solid #00bcff;
            filter: drop-shadow(0 0 6px #00bcff);
            z-index: 10;

            animation:
                creepForward 0.8s ease-in-out infinite alternate;
        }

        @keyframes creepForward {
            0% {
                transform: translateX(0px) scale(0.95);
            }

            100% {
                transform: translateX(10px) scale(1.05);
            }
        }

        /* =========================
           BACKGROUND FOREST
           ========================= */

        .background-tree {
            position: absolute;
            top: 10px;
            width: 32px;
            height: 70px;

            z-index: 2;

            opacity: 0.25;

            animation:
                backgroundScroll 7s linear infinite;
        }

        .background-tree .leaf-top {
            left: 8px;
            top: 0;

            border-left-width: 8px;
            border-right-width: 8px;
            border-bottom: 17px solid #00b84f;

            filter:
                drop-shadow(0 0 2px #00b84f);
        }

        .background-tree .leaf-bottom {
            left: 3px;
            top: 13px;

            border-left-width: 13px;
            border-right-width: 13px;
            border-bottom-width: 22px;
            border-bottom-color: #00b84f;

            filter:
                drop-shadow(0 0 2px #00b84f);
        }

        .background-tree .trunk {
            left: 13px;
            top: 35px;

            width: 7px;
            height: 22px;

            border-color: #00b84f;

            filter:
                drop-shadow(0 0 2px #00b84f);
        }

        @keyframes backgroundScroll {
            0% {
                left: 100%;
                opacity: 0;
            }

            10% {
                opacity: 0.25;
            }

            90% {
                opacity: 0.25;
            }

            100% {
                left: -40px;
                opacity: 0;
            }
        }

        .background-tree-1 {
            top: 5px;
            transform: scale(0.65);
            animation-delay: 0s;
        }

        .background-tree-2 {
            top: 18px;
            transform: scale(0.8);
            animation-delay: 2s;
        }

        .background-tree-3 {
            top: 0;
            transform: scale(0.55);
            animation-delay: 4s;
        }

        .background-tree-4 {
            top: 25px;
            transform: scale(0.7);
            animation-delay: 5.5s;
        }

        .background-tree-5 {
            top: 8px;
            transform: scale(0.6);
            animation-delay: 7s;
        }

        /* =========================
           GROUND LINE
           ========================= */

        .axis-line {
            position: absolute;
            top: 63px;

            width: 100%;
            height: 1px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #00ff6611,
                    #00ff6611 4px,
                    transparent 4px,
                    transparent 8px
                );

            z-index: 5;
        }

        /* =========================
           FOREGROUND FOREST
           ========================= */

        .foreground-tree {
            position: absolute;

            top: 25px;

            width: 40px;
            height: 80px;

            z-index: 20;

            animation:
                foregroundScroll 4.5s linear infinite;
        }

        .foreground-tree .leaf-top {
            filter:
                drop-shadow(0 0 7px #00ff66)
                drop-shadow(0 0 3px #00ff66);
        }

        .foreground-tree .leaf-bottom {
            filter:
                drop-shadow(0 0 8px #00ff66)
                drop-shadow(0 0 3px #00ff66);
        }

        .foreground-tree .trunk {
            filter:
                drop-shadow(0 0 7px #00ff66);
        }

        @keyframes foregroundScroll {
            0% {
                left: 100%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                left: -50px;
                opacity: 0;
            }
        }

        .foreground-tree-1 {
            top: 28px;
            transform: scale(1.15);
            animation-delay: 1s;
        }

        .foreground-tree-2 {
            top: 42px;
            transform: scale(0.9);
            animation-delay: 3.5s;
        }

        .foreground-tree-3 {
            top: 18px;
            transform: scale(1.3);
            animation-delay: 6s;
        }

        .foreground-tree-4 {
            top: 35px;
            transform: scale(1);
            animation-delay: 8s;
        }

        /* =========================
           TREE PARTS
           ========================= */

        .leaf-top {
            position: absolute;

            left: 10px;
            top: 0;

            width: 0;
            height: 0;

            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #00ff66;
        }

        .leaf-bottom {
            position: absolute;

            left: 5px;
            top: 15px;

            width: 0;
            height: 0;

            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid #00ff66;
        }

        .trunk {
            position: absolute;

            left: 16px;
            top: 40px;

            width: 8px;
            height: 25px;

            border: 2px solid #00ff66;
        }
    </style>
</head>

<body>

    <div class="stage">

        <!-- Background trees -->

        <div class="background-tree background-tree-1">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="background-tree background-tree-2">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="background-tree background-tree-3">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="background-tree background-tree-4">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="background-tree background-tree-5">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>


        <!-- Ground line -->

        <div class="axis-line"></div>


        <!-- Player -->

        <div class="player"></div>


        <!-- Foreground trees -->

        <div class="foreground-tree foreground-tree-1">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="foreground-tree foreground-tree-2">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="foreground-tree foreground-tree-3">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

        <div class="foreground-tree foreground-tree-4">
            <div class="leaf-top"></div>
            <div class="leaf-bottom"></div>
            <div class="trunk"></div>
        </div>

    </div>

</body>
</html>
