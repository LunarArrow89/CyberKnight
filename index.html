<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Utopia // Planetary Idle OS</title>
    <style>
        :root {
            --bg-dark: #05070b;
            --panel-glass: rgba(16, 22, 35, 0.75);
            --border-glow: rgba(34, 197, 94, 0.15);
            --neon-green: #22c55e;
            --neon-warn: #f97316;
            --text-bright: #f0fdf4;
            --text-dim: #74808c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-bright);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--neon-green);
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.3);
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .terminal-panel {
            background: var(--panel-glass);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            box-shadow: inset 0 0 10px rgba(34, 197, 94, 0.05);
            flex-shrink: 0;
        }

        .panel-header {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--neon-green);
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--border-glow);
            padding-bottom: 2px;
        }

        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .data-node {
            display: flex;
            flex-direction: column;
        }

        .data-label {
            font-size: 0.6rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .data-value {
            font-size: 0.85rem;
            font-weight: bold;
        }

        .bar-frame {
            margin-top: 2px;
            background: rgba(255, 255, 255, 0.05);
            height: 5px;
            overflow: hidden;
            width: 100%;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            background-color: var(--neon-green);
            transition: width 0.3s linear;
        }

        #suit-bar { background-color: #3b82f6; }

        .scavenged-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
        }

        .flex-feed-panel {
            background: var(--panel-glass);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .feed-box {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            font-size: 0.75rem;
            color: #a7f3d0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .feed-line {
            padding-bottom: 2px;
            border-bottom: 1px solid rgba(34, 197, 94, 0.03);
            word-break: break-all;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }

        button {
            background: rgba(34, 197, 94, 0.08);
            color: var(--neon-green);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 8px 6px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        button:hover:not(:disabled), button:active:not(:disabled) {
            background: rgba(34, 197, 94, 0.2);
            color: var(--text-bright);
        }

        button:disabled {
            opacity: 0.3;
            border-color: rgba(255,255,255,0.1);
            color: var(--text-dim);
        }

        button.gate-trigger {
            background: var(--neon-green);
            color: var(--bg-dark);
            font-weight: bold;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .badge {
            padding: 1px 4px;
            font-size: 0.55rem;
            float: right;
            border: 1px solid;
        }
        .badge-scouting { color: var(--neon-green); border-color: var(--neon-green); }
        .badge-docked { color: var(--neon-warn); border-color: var(--neon-warn); }

        .cloud-input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: var(--text-bright);
            font-family: inherit;
            font-size: 0.65rem;
            padding: 4px 6px;
            margin-bottom: 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>UTOPIA // OS</h1>
        <div class="subtitle">Settlement Automation Engine</div>
    </header>

    <!-- Telemetry Readout -->
    <div class="terminal-panel">
        <div class="panel-header">
            Telemetry
            <span id="status-badge" class="badge badge-scouting">SCOUTING</span>
        </div>
        <div class="grid-2x2">
            <div class="data-node">
                <span class="data-label">Suit Integrity</span>
                <span class="data-value" id="suit-text">100%</span>
                <div class="bar-frame"><div id="suit-bar" class="bar-fill"></div></div>
            </div>
            <div class="data-node">
                <span class="data-label">Active Sector</span>
                <span class="data-value" id="sector-text">Sector 1</span>
            </div>
            <div class="data-node">
                <span class="data-label">Credits</span>
                <span class="data-value" id="credits-text" style="color: #cbd5e1;">0</span>
            </div>
            <div class="data-node">
                <span class="data-label">Insulation</span>
                <span class="data-value" id="shield-text">Level 5</span>
            </div>
        </div>
    </div>

    <!-- Dynamic Atmospheric Components Drop -->
    <div class="terminal-panel">
        <div class="panel-header">Atmospheric Scrubber</div>
        <div class="scavenged-card">
            <div style="max-width: 60%; overflow: hidden;">
                <strong id="filter-name" style="font-size:0.75rem; display:block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Standard Porous Core</strong>
                <span class="data-label" id="filter-spec" style="font-size:0.55rem; display:block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Insulation Absorption: -2</span>
            </div>
            <div id="scrap-controls" style="display:none; flex-shrink:0;">
                <button onclick="salvageFilter()" style="padding: 3px 6px; font-size: 0.6rem;">Scrap</button>
                <button onclick="installFilter()" style="padding: 3px 6px; font-size: 0.6rem; border-color:var(--neon-green);">Fit</button>
            </div>
            <div id="filter-alert" style="font-size:0.6rem; color: var(--neon-warn); display:none;">⚠️ Matrix Found</div>
        </div>
    </div>

    <!-- Telemetry Log -->
    <div class="flex-feed-panel">
        <div class="panel-header">Planetary Feed Log</div>
        <div class="feed-box" id="log-feed">
            <div class="feed-line">[INIT] Scanner system running. Mapping Utopia nodes...</div>
        </div>
    </div>

    <!-- Settlement Infrastructure Interventions -->
    <div class="terminal-panel" style="margin-bottom:6px;">
        <div class="action-grid">
            <button id="btn-patch" onclick="injectNanites()">Nanites (-20c)</button>
            <button id="btn-overdrive" onclick="engageOverdrive()">Overdrive (-50c)</button>
        </div>
        <div class="action-grid" style="grid-template-columns: 1fr; margin-bottom:0;">
            <button id="btn-fabricate" onclick="upgradeSuit()">Upgrade Chassis (-60c)</button>
        </div>
    </div>

    <!-- Sector Progression Checkpoint -->
    <button id="btn-gate" class="gate-trigger" onclick="overrideSectorGate()">
        Hack Sector Vault Gate 📡
    </button>

    <!-- Sync Interface Profile Matrix -->
    <div class="terminal-panel" style="border-color: rgba(59, 130, 246, 0.2); margin-bottom: 0;">
        <input type="text" id="cloud-string-input" class="cloud-input" placeholder="Paste Cloud Data Code Here...">
        <div class="action-grid" style="margin-bottom:0;">
            <button onclick="exportCloudSave()" style="color: #3b82f6; border-color: rgba(59, 130, 246, 0.3); padding: 5px;">Export Cloud</button>
            <button onclick="importCloudSave()" style="color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); padding: 5px;">Import Cloud</button>
        </div>
    </div>

    <script>
        let osState = {
            suitIntegrity: 100,
            maxSuit: 100,
            credits: 40,
            baseInsulation: 5,
            sector: 1,
            status: "scouting",
            currentFilterName: "Standard Porous Core",
            filterRating: 2,
            scavengedFilter: null, 
            overdriveTime: 0
        };

        const sectors = [
            { name: "Sulphur Barrens", minIns: 8, gateSystem: "Alpha Gate" },
            { name: "Neon Tundra", minIns: 22, gateSystem: "Beta Gate" },
            { name: "Corrosive Swamps", minIns: 45, gateSystem: "Gamma Gate" },
            { name: "Obsidian Core", minIns: 75, gateSystem: "Prime Central" }
        ];

        const anomalies = ["Acid Squall", "EMP Pulse", "Bio-Leak", "Spore Burst", "Thermal Flare"];
        const buildPrefix = ["Cryo", "Nano", "Graphene", "Mag", "Prism", "Dense"];
        const componentTypes = ["Condenser", "Scrubber", "Sieve", "Barrier"];

        function autoSaveLocal() {
            localStorage.setItem("utopia_save_profile", JSON.stringify(osState));
        }

        function autoLoadLocal() {
            const savedProfile = localStorage.getItem("utopia_save_profile");
            if (savedProfile) {
                try {
                    const parsed = JSON.parse(savedProfile);
                    if (parsed && typeof parsed.sector === 'number') {
                        osState = parsed;
                        postLog("[SYSTEM] Memory profile loaded.");
                    }
                } catch(e) {
                    postLog("[SYSTEM] Profile corrupted.");
                }
            }
        }

        function exportCloudSave() {
            autoSaveLocal();
            const rawString = btoa(JSON.stringify(osState));
            const inputField = document.getElementById("cloud-string-input");
            inputField.value = rawString;
            inputField.select();
            document.execCommand("copy");
            postLog("[SYSTEM] Code copied to clipboard.");
            alert("Save Code Copied! Paste into Google Docs or Apple Notes to back it up.");
        }

        function importCloudSave() {
            const inputField = document.getElementById("cloud-string-input").value.trim();
            if (!inputField) return;
            try {
                const baseParsed = JSON.parse(atob(inputField));
                if (baseParsed && typeof baseParsed.sector === 'number') {
                    osState = baseParsed;
                    autoSaveLocal();
                    postLog("[SYSTEM] Cloud profile loaded.");
                    refreshInterface();
                }
            } catch(e) {
                alert("Invalid save code syntax.");
            }
        }

        function coreLoop() {
            if (osState.overdriveTime > 0) {
                osState.overdriveTime--;
            }

            if (osState.status === "docked") {
                osState.suitIntegrity += 20;
                if (osState.suitIntegrity >= osState.maxSuit) {
                    osState.suitIntegrity = osState.maxSuit;
                    osState.status = "scouting";
                    postLog("[SYSTEM] Repaired. Rover redeployed.");
                }
                autoSaveLocal();
                refreshInterface();
                return;
            }

            let extractedCredits = Math.floor(Math.random() * 4) + 3 + osState.sector;
            osState.credits += extractedCredits;

            if (Math.random() < 0.10) {
                let planetHazard = osState.sector * 14 + Math.floor(Math.random() * 8);
                let totalProtection = osState.baseInsulation + osState.filterRating;
                let absoluteDamage = Math.max(5, planetHazard - Math.floor(totalProtection * 0.9));
                osState.suitIntegrity -= absoluteDamage;

                let immediateAnomaly = anomalies[Math.floor(Math.random() * anomalies.length)];
                postLog(`[WARN] ${immediateAnomaly}: Hull lost ${absoluteDamage}%.`);

                if (Math.random() < 0.60 && !osState.scavengedFilter) {
                    let computedRating = (osState.sector * 6) + Math.floor(Math.random() * 5);
                    let computedName = `${buildPrefix[Math.floor(Math.random() * buildPrefix.length)]} ${componentTypes[Math.floor(Math.random() * componentTypes.length)]}`;
                    osState.scavengedFilter = { name: computedName, power: computedRating };
                    postLog(`[DATA] Salvaged: ${computedName} (-${computedRating} Tox).`);
                }
            } else {
                let coordX = Math.floor(Math.random() * 89) + 10;
                let coordY = Math.floor(Math.random() * 89) + 10;
                postLog(`[SCAN] Telemetry block [X:${coordX}/Y:${coordY}] (+${extractedCredits}c).`);
            }

            if (osState.suitIntegrity <= 0) {
                osState.suitIntegrity = 0;
                osState.status = "docked";
                postLog("[CRITICAL] Suit breach! Auto-docking for repairs.");
            }

            autoSaveLocal();
            refreshInterface();
        }

        function installFilter() {
            if (!osState.scavengedFilter) return;
            osState.currentFilterName = osState.scavengedFilter.name;
            osState.filterRating = osState.scavengedFilter.power;
            osState.scavengedFilter = null;
            autoSaveLocal();
            refreshInterface();
        }

        function salvageFilter() {
            if (!osState.scavengedFilter) return;
            osState.credits += 30;
            osState.scavengedFilter = null;
            autoSaveLocal();
            refreshInterface();
        }

        function injectNanites() {
            if (osState.credits >= 20) {
                osState.credits -= 20;
                osState.suitIntegrity = Math.min(osState.maxSuit, osState.suitIntegrity + 35);
                postLog("[FIX] Nanites sealed active leaks.");
                autoSaveLocal();
                refreshInterface();
            }
        }

        function engageOverdrive() {
            if (osState.credits >= 50) {
                osState.credits -= 50;
                osState.overdriveTime += 20; 
                postLog("[SPEED] Overdrive active. Travel velocity doubled.");
                autoSaveLocal();
                refreshInterface();
            }
        }

        function upgradeSuit() {
            let cost = 45 + (osState.baseInsulation * 3);
            if (osState.credits >= cost) {
                osState.credits -= cost;
                osState.baseInsulation += 5;
                osState.maxSuit += 15;
                osState.suitIntegrity = osState.maxSuit;
                postLog(`[CHASSIS] Frame insulation upgraded.`);
                autoSaveLocal();
                refreshInterface();
            }
        }

        function overrideSectorGate() {
            let contextSector = sectors[osState.sector - 1];
            let actualInsulation = osState.baseInsulation + osState.filterRating;

            if (actualInsulation >= contextSector.minIns) {
                postLog(`[SUCCESS] Vault bypassed. Moving maps.`);
                if (osState.sector < sectors.length) osState.sector++;
            } else {
                let damage = Math.floor(osState.maxSuit * 0.5);
                osState.suitIntegrity = Math.max(0, osState.suitIntegrity - damage);
                postLog(`[FAIL] Firewall backlash fried chassis lines.`);
                if (osState.suitIntegrity === 0) osState.status = "docked";
            }
            autoSaveLocal();
            refreshInterface();
        }

        function postLog(txt) {
            const viewport = document.getElementById("log-feed");
            const element = document.createElement("div");
            element.className = "feed-line";
            element.innerText = txt;
            viewport.appendChild(element);
            viewport.scrollTop = viewport.scrollHeight;
            
            if(viewport.childNodes.length > 8) {
                viewport.removeChild(viewport.firstChild);
            }
        }

        function refreshInterface() {
            document.getElementById("suit-text").innerText = `${osState.suitIntegrity}% / ${osState.maxSuit}%`;
            document.getElementById("credits-text").innerText = osState.credits;
            document.getElementById("shield-text").innerText = `Lv.${osState.baseInsulation}`;
            
            let curData = sectors[osState.sector - 1];
            document.getElementById("sector-text").innerText = curData.name;
            document.getElementById("suit-bar").style.width = `${(osState.suitIntegrity / osState.maxSuit) * 100}%`;

            if (osState.scavengedFilter) {
                document.getElementById("filter-alert").style.display = "block";
                document.getElementById("scrap-controls").style.display = "block";
                document.getElementById("filter-name").innerHTML = `<span style='color:var(--text-dim)'>New:</span> ${osState.scavengedFilter.name}`;
            } else {
                document.getElementById("filter-alert").style.display = "none";
                document.getElementById("scrap-controls").style.display = "none";
                document.getElementById("filter-name").innerText = osState.currentFilterName;
                document.getElementById("filter-spec").innerText = `Insulation Absorption: -${osState.filterRating}`;
            }

            const frameBadge = document.getElementById("status-badge");
            frameBadge.innerText = osState.status.toUpperCase();
            frameBadge.className = osState.status === "docked" ? "badge badge-docked" : "badge badge-scouting";

            document.getElementById("btn-patch").disabled = osState.credits < 20;
            document.getElementById("btn-overdrive").disabled = osState.credits < 50;
            
            let scalingCost = 45 + (osState.baseInsulation * 3);
            document.getElementById("btn-fabricate").innerText = `Upgrade Chassis (-${scalingCost}c)`;
            document.getElementById("btn-fabricate").disabled = osState.credits < scalingCost;
            
            document.getElementById("btn-gate").innerText = `Hack ${curData.gateSystem} (Req. ~${curData.minIns} Ins.)`;
        }

        function clockRuntime() {
            coreLoop();
            let baseInterval = osState.overdriveTime > 0 ? 2500 : 5000;
            setTimeout(clockRuntime, baseInterval);
        }

        autoLoadLocal();
        refreshInterface();
        setTimeout(clockRuntime, 3000);
    </script>
</body>
</html>
