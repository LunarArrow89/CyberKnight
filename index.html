<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whispering Woods</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; padding: 16px; background: radial-gradient(circle at top, #26352c 0%, #18231d 40%, #0d130f 100%); color: #e8eee9; font-family: Georgia, "Times New Roman", serif; }
        .game { width: min(560px, 100%); margin: 0 auto; }
        header { text-align: center; margin-bottom: 12px; }
        h1 { margin: 0; color: #dce9df; font-size: 27px; }
        .subtitle { margin: 5px 0 0; color: #8fa594; font-size: 13px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .stat { padding: 9px; text-align: center; background: #202d24; border: 1px solid #35463a; border-radius: 10px; }
        .stat-label { color: #8fa594; font-size: 11px; margin-bottom: 3px; }
        .stat-value { font-size: 15px; font-weight: bold; }
        .game-box { overflow: hidden; background: #18221b; border: 1px solid #35463a; border-radius: 13px; }
        .section { padding: 13px; border-bottom: 1px solid #35463a; }
        .section:last-child { border-bottom: 0; }
        .section-title { margin-bottom: 8px; color: #d5e4d8; font-size: 15px; font-weight: bold; }
        .bar { width: 100%; height: 12px; overflow: hidden; background: #0d130f; border: 1px solid #35463a; border-radius: 999px; }
        .bar-fill { height: 100%; width: 0; transition: width .2s linear; }
        #forestBar { background: #75947c; }
        #hpBar { background: #b56f72; }
        #restBar { background: #829f87; }
        .bar-text { margin-top: 5px; color: #9cad9f; font-size: 12px; text-align: center; }
        .buttons { display: flex; gap: 8px; margin-top: 9px; }
        button { flex: 1; padding: 9px 10px; color: #e5eee7; background: #29382d; border: 1px solid #526856; border-radius: 9px; font: inherit; cursor: pointer; }
        button:hover:not(:disabled) { background: #35483a; }
        button:disabled { opacity: .45; cursor: not-allowed; }
        .danger { background: #3a2729; border-color: #754b4d; }
        .log { height: 145px; overflow-y: auto; padding: 8px; background: #101710; border: 1px solid #29372d; border-radius: 9px; }
        .log-entry { padding: 5px 3px; color: #aebcaf; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,.04); }
        .victory { display: none; padding: 12px; color: #d8eadb; text-align: center; background: #26392b; border: 1px solid #4e6b53; border-radius: 9px; }
        @media (max-width: 500px) { body { padding: 8px; } .stats { gap: 4px; } .stat { padding: 7px 3px; } }
    </style>
</head>
<body>
<div class="game">
    <header>
        <h1>Whispering Woods</h1>
        <p class="subtitle">Walk through the darkness and find your way out.</p>
    </header>

    <div class="stats">
        <div class="stat"><div class="stat-label">HP</div><div class="stat-value" id="hpText">40 / 40</div></div>
        <div class="stat"><div class="stat-label">Attack</div><div class="stat-value" id="attackText">8</div></div>
        <div class="stat"><div class="stat-label">Status</div><div class="stat-value" id="statusText">Walking</div></div>
    </div>

    <div class="game-box">
        <div class="section">
            <div class="section-title">🌲 Forest Journey</div>
            <div class="bar"><div class="bar-fill" id="forestBar"></div></div>
            <div class="bar-text" id="forestText">0:00 / 5:00</div>
        </div>
        <div class="section">
            <div class="section-title">❤️ Health</div>
            <div class="bar"><div class="bar-fill" id="hpBar"></div></div>
            <div class="bar-text" id="hpBarText">40 / 40 HP</div>
        </div>
        <div class="section">
            <div class="section-title">💤 Rest</div>
            <div class="bar"><div class="bar-fill" id="restBar"></div></div>
            <div class="bar-text" id="restText">Rest when you need to recover.</div>
            <div class="buttons">
                <button id="restButton" type="button">Rest</button>
                <button id="leaveButton" type="button" disabled>Leave</button>
            </div>
        </div>
        <div class="section">
            <div class="section-title">📖 Adventure Log</div>
            <div class="log" id="log"></div>
        </div>
        <div class="section">
            <div class="victory" id="victory">You found your way out!<br><small>The Whispering Woods are behind you.</small></div>
            <div class="buttons">
                <button id="saveButton" type="button">Save</button>
                <button id="loadButton" type="button">Load</button>
                <button id="deleteButton" class="danger" type="button">Delete Save</button>
            </div>
        </div>
    </div>
</div>

<script>
const FOREST_DURATION = 5 * 60;
const player = { hp: 40, maxHp: 40, attack: 8 };
const enemies = [
    { name: "Lost Wolf", maxHp: 18, attack: 4 },
    { name: "Forest Goblin", maxHp: 22, attack: 3 },
    { name: "Shadow Spider", maxHp: 15, attack: 5 },
    { name: "Angry Boar", maxHp: 25, attack: 4 },
    { name: "Dark Slime", maxHp: 20, attack: 2 }
];
let forestTime = 0;
let resting = false;
let forcedRest = false;
let gameEnded = false;
let restStartedAt = 0;
let restDuration = 0;

const $ = id => document.getElementById(id);
function addLog(message) {
    const entry = document.createElement("div");
    entry.className = "log-entry";
    entry.textContent = message;
    $("log").appendChild(entry);
    $("log").scrollTop = $("log").scrollHeight;
}
function formatTime(seconds) {
    const minutes = Math.floor(seconds / 60);
    return `${minutes}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;
}
function updateHP() {
    const hp = Math.max(0, Math.min(player.hp, player.maxHp));
    player.hp = hp;
    $("hpText").textContent = `${hp} / ${player.maxHp}`;
    $("hpBarText").textContent = `${hp} / ${player.maxHp} HP`;
    $("hpBar").style.width = `${(hp / player.maxHp) * 100}%`;
    $("attackText").textContent = player.attack;
}
function updateForest() {
    const progress = Math.min(100, (forestTime / FOREST_DURATION) * 100);
    $("forestBar").style.width = `${progress}%`;
    $("forestText").textContent = `${formatTime(forestTime)} / 5:00`;
}
function updateStatus() {
    $("statusText").textContent = gameEnded ? "Escaped" : forcedRest ? "Forced Rest" : resting ? "Resting" : "Walking";
    $("restButton").disabled = gameEnded || resting || player.hp >= player.maxHp;
    $("leaveButton").disabled = !resting || forcedRest;
}
function encounter() {
    if (gameEnded || resting || forcedRest || Math.random() >= 0.035) return;
    const enemy = { ...enemies[Math.floor(Math.random() * enemies.length)] };
    while (enemy.hp > 0 && player.hp > 0) {
        enemy.hp -= player.attack;
        if (enemy.hp <= 0) { addLog(`You defeated ${enemy.name}.`); break; }
        player.hp = Math.max(0, player.hp - Math.max(1, Math.floor(enemy.attack - player.attack / 2)));
    }
    updateHP();
    if (player.hp <= 0) {
        forcedRest = true;
        startRest(true);
        addLog(`${enemy.name} defeated you. You must rest.`);
    }
}
function startRest(isForced = false) {
    if (gameEnded || resting || (!isForced && player.hp >= player.maxHp)) return;
    resting = true;
    forcedRest = isForced;
    restStartedAt = Date.now();
    restDuration = isForced ? 10 : Math.max(10, (player.maxHp - player.hp) * 10);
    updateStatus();
}
function leaveRest() {
    if (!resting || forcedRest) return;
    resting = false;
    $("restBar").style.width = "0%";
    $("restText").textContent = "Rest stopped.";
    updateStatus();
    addLog("You stopped resting.");
}
function updateRest() {
    if (!resting) return;
    const elapsed = (Date.now() - restStartedAt) / 1000;
    const progress = Math.min(1, elapsed / restDuration);
    $("restBar").style.width = `${progress * 100}%`;
    $("restText").textContent = `Resting: ${Math.floor(progress * 100)}%`;
    if (progress < 1) return;
    resting = false;
    forcedRest = false;
    player.hp = player.maxHp;
    updateHP();
    updateStatus();
    $("restText").textContent = "Fully recovered.";
    addLog("You finished resting and recovered your HP.");
}
function tick() {
    if (!gameEnded) {
        if (!resting && !forcedRest) {
            forestTime = Math.min(FOREST_DURATION, forestTime + 1);
            encounter();
            if (forestTime >= FOREST_DURATION) {
                gameEnded = true;
                $("victory").style.display = "block";
                addLog("You made it through the forest!");
            }
        }
        updateForest();
        updateRest();
        updateStatus();
    }
}

$("restButton").addEventListener("click", () => startRest());
$("leaveButton").addEventListener("click", leaveRest);
$("saveButton").addEventListener("click", () => saveGame());
$("loadButton").addEventListener("click", () => loadGame());
$("deleteButton").addEventListener("click", () => deleteSave());
updateHP();
updateForest();
updateStatus();
addLog("The forest path begins...");
setInterval(tick, 1000);
</script>
<script src="save.js"></script>
<script>
    // Restore the saved path after save.js has loaded and all game elements exist.
    loadGame();
</script>
</body>
</html>
