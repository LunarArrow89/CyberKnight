<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wildwood Haven</title>

<style>

body {
    margin:0;
    overflow:hidden;
    background:#101010;
    font-family:Arial, sans-serif;
}


canvas {
    display:block;
}


#ui {

    position:absolute;
    top:15px;
    left:15px;

    background:#172317dd;
    color:white;

    padding:15px;
    border-radius:15px;

    border:2px solid #76c893;

}


button {

    background:#76c893;
    color:white;

    border:none;

    padding:8px 15px;

    border-radius:8px;

    cursor:pointer;

}


button:hover {

    background:#95d5b2;

}


</style>

</head>


<body>


<canvas id="game"></canvas>


<div id="ui">

<h2>🌲 Wildwood Haven</h2>

<p>❤️ Health: <span id="hp">100</span></p>

<p>🪵 Wood: <span id="wood">0</span></p>

<p>🪨 Stone: <span id="stone">0</span></p>

<p>🏠 Houses: <span id="houses">0</span></p>


<button onclick="buildHouse()">
Build House (10 Wood + 5 Stone)
</button>

<br><br>

<button onclick="saveGame()">
Save Game
</button>


<p id="message"></p>

</div>




<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


canvas.width=window.innerWidth;
canvas.height=window.innerHeight;



let player={

x:500,
y:500,

size:25,

speed:4,

hp:100

};



let keys={};



let inventory={

wood:0,
stone:0,
houses:0

};



// VILLAGE AREA

let village={

x:500,
y:500,

width:350,
height:300

};



// WORLD OBJECTS


let objects=[];


for(let i=0;i<250;i++){


let type=Math.random()<0.65?
"tree":
"stone";


let x=Math.random()*3000;
let y=Math.random()*3000;



// avoid spawning inside village


if(
x>350 &&
x<650 &&
y>350 &&
y<650
)
continue;



objects.push({

x:x,
y:y,
type:type,
size:25

});


}





let camera={

x:0,
y:0

};





document.addEventListener(
"keydown",
e=>{

keys[e.key.toLowerCase()]=true;

});


document.addEventListener(
"keyup",
e=>{

keys[e.key.toLowerCase()]=false;

});





function update(){


move();


camera.x=
player.x-canvas.width/2;


camera.y=
player.y-canvas.height/2;


collect();


draw();


requestAnimationFrame(update);

}






function move(){


if(keys.w)
player.y-=player.speed;


if(keys.s)
player.y+=player.speed;


if(keys.a)
player.x-=player.speed;


if(keys.d)
player.x+=player.speed;



}





function collect(){


for(let i=objects.length-1;i>=0;i--){


let obj=objects[i];


let distance=Math.hypot(

player.x-obj.x,

player.y-obj.y

);



if(distance<35){


if(obj.type=="tree"){

inventory.wood++;

message("Collected wood!");

}

else{

inventory.stone++;

message("Collected stone!");

}


objects.splice(i,1);


updateUI();

}


}



}





function buildHouse(){


if(
inventory.wood>=10 &&
inventory.stone>=5
){


inventory.wood-=10;
inventory.stone-=5;

inventory.houses++;


message("You built a new house! 🏠");


}


else{


message("Not enough resources!");

}



updateUI();


}





function draw(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



// ground


ctx.fillStyle="#3a7d44";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);





// village


ctx.fillStyle="#d8c27a";


ctx.fillRect(

village.x-camera.x,

village.y-camera.y,

village.width,

village.height

);





// objects


for(let obj of objects){


let x=obj.x-camera.x;
let y=obj.y-camera.y;



if(obj.type=="tree"){


ctx.fillStyle="#14532d";

ctx.beginPath();

ctx.arc(
x,
y,
25,
0,
Math.PI*2
);

ctx.fill();


ctx.fillStyle="#713f12";

ctx.fillRect(
x-5,
y,
10,
25
);


}

else{


ctx.fillStyle="#64748b";

ctx.fillRect(
x-15,
y-15,
30,
30
);


}


}







// houses


for(let i=0;i<inventory.houses;i++){


ctx.fillStyle="#8b4513";


ctx.fillRect(

village.x-camera.x+40+(i*60),

village.y-camera.y+60,

40,

40

);


ctx.fillStyle="#ef4444";


ctx.beginPath();


ctx.moveTo(

village.x-camera.x+35+(i*60),

village.y-camera.y+60

);


ctx.lineTo(

village.x-camera.x+60+(i*60),

village.y-camera.y+30

);


ctx.lineTo(

village.x-camera.x+85+(i*60),

village.y-camera.y+60

);


ctx.fill();


}





// player


ctx.fillStyle="#facc15";


ctx.fillRect(

player.x-camera.x-player.size/2,

player.y-camera.y-player.size/2,

player.size,

player.size

);



}





function updateUI(){


document.getElementById("wood").innerText=
inventory.wood;


document.getElementById("stone").innerText=
inventory.stone;


document.getElementById("houses").innerText=
inventory.houses;


document.getElementById("hp").innerText=
player.hp;


}




function message(text){


document.getElementById("message").innerText=text;


setTimeout(()=>{

document.getElementById("message").innerText="";

},2000);


}





function saveGame(){


localStorage.setItem(
"wildwoodSave",
JSON.stringify({

player,
inventory

})

);


message("Game saved!");

}





let save=localStorage.getItem("wildwoodSave");


if(save){


let data=JSON.parse(save);


player=data.player;

inventory=data.inventory;


}





updateUI();

update();


</script>


</body>
</html>
