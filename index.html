<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberKnight</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game-container">


<h1>CYBERKNIGHT</h1>

<p class="subtitle">
A Neon Text RPG
</p>



<div id="classScreen">


<h2>Choose Your Class</h2>


<div class="class-grid">


<button class="class-card" onclick="chooseClass('Warrior')">

<h3>⚔️ WARRIOR</h3>

<p>
Strong and durable. A Jack of all trades
<br>
HP: 130
<br>
Attack: 14
<br>
Skill: Power Strike
</p>

</button>



<button class="class-card" onclick="chooseClass('Rogue')">

<h3>🗡️ ROGUE</h3>

<p>
Fast and deadly.
<br>
HP: 100
<br>
Attack: 12
<br>
Skill: Critical Strike
</p>

</button>



<button class="class-card" onclick="chooseClass('Mage')">

<h3>⚡ MAGE</h3>

<p>
Powerful magical attacks.
<br>
HP: 85
<br>
Attack: 9
<br>
Skill: Energy Blast
</p>

</button>


</div>

</div>





<div id="gameScreen" style="display:none;">


<div class="card">

<h2 id="playerTitle">
</h2>


<p id="stats">
</p>


</div>



<button onclick="explore()">
Explore
</button>


<button onclick="work()">
Work
</button>


<button onclick="rest()">
Rest
</button>


<button onclick="startBattle()">
Battle
</button>


<button onclick="resetGame()">
Reset Save
</button>



</div>





<div id="battleScreen" style="display:none;">


<div class="card">


<h2>
Battle
</h2>


<h3 id="enemyName">
</h3>


<p id="enemyStats">
</p>


<p id="battleLog">
</p>



<button onclick="attack()">
Attack
</button>


<button onclick="skillAttack()">
Skill
</button>


<button onclick="runAway()">
Run
</button>



</div>


</div>




</div>





<script>


let player = {

name:"",
class:"",
hp:100,
maxHp:100,
attack:10,
gold:25,
level:1,
xp:0

};



let enemy = null;



const classes = {


Warrior:{
hp:130,
attack:14,
skill:"Power Strike"
},


Rogue:{
hp:100,
attack:12,
skill:"Critical Strike"
},


Mage:{
hp:85,
attack:9,
skill:"Energy Blast"
}


};




function saveGame(){

localStorage.setItem(
"CyberKnightSave",
JSON.stringify(player)
);

}




function loadGame(){

let save = localStorage.getItem(
"CyberKnightSave"
);


if(save){

player = JSON.parse(save);


document.getElementById("classScreen").style.display="none";

document.getElementById("gameScreen").style.display="block";

updateStats();

}

}




function chooseClass(type){


let c = classes[type];


player.class=type;

player.hp=c.hp;

player.maxHp=c.hp;

player.attack=c.attack;


saveGame();


document.getElementById("classScreen").style.display="none";

document.getElementById("gameScreen").style.display="block";


updateStats();


}




function updateStats(){


document.getElementById("playerTitle").innerHTML =
player.class + " CyberKnight";


document.getElementById("stats").innerHTML =

`
HP: ${player.hp}/${player.maxHp}
<br>
Attack: ${player.attack}
<br>
Level: ${player.level}
<br>
XP: ${player.xp}
<br>
Gold: ${player.gold}
`;

}





function work(){


alert(
"Started a job... wait 10 seconds!"
);


setTimeout(()=>{


let money =
Math.floor(Math.random()*20)+10;


player.gold+=money;


saveGame();

updateStats();


alert(
"You earned "+money+" gold!"
);


},10000);



}






function rest(){


alert(
"Resting... wait 5 seconds!"
);



setTimeout(()=>{


let heal=25;


player.hp+=heal;


if(player.hp>player.maxHp){

player.hp=player.maxHp;

}


saveGame();

updateStats();


alert(
"You recovered HP!"
);


},5000);



}






function explore(){


let xp =
Math.floor(Math.random()*20)+5;


player.xp+=xp;


player.gold+=5;


saveGame();


updateStats();


alert(
"You explored and gained "+xp+" XP!"
);



}







function startBattle(){


document.getElementById("gameScreen").style.display="none";

document.getElementById("battleScreen").style.display="block";



enemy={

name:"Cyber Slime",

hp:50,

attack:8

};



updateBattle();



}






function updateBattle(){


document.getElementById("enemyName").innerHTML =
enemy.name;


document.getElementById("enemyStats").innerHTML =
"HP: "+enemy.hp;


document.getElementById("battleLog").innerHTML =
"Choose an action!";



}







function attack(){


enemy.hp-=player.attack;


if(enemy.hp<=0){


winBattle();

return;


}



enemyTurn();


}






function skillAttack(){


enemy.hp-=player.attack*2;


if(enemy.hp<=0){


winBattle();

return;


}


enemyTurn();


}






function enemyTurn(){


player.hp-=enemy.attack;


if(player.hp<=0){


alert("You lost!");

resetGame();

return;


}


saveGame();

updateStats();

updateBattle();


}






function winBattle(){


let reward=25;


player.gold+=reward;

player.xp+=20;


saveGame();


alert(
"You won! +25 gold +20 XP"
);


document.getElementById("battleScreen").style.display="none";

document.getElementById("gameScreen").style.display="block";


updateStats();


}







function runAway(){


document.getElementById("battleScreen").style.display="none";

document.getElementById("gameScreen").style.display="block";


}






function resetGame(){


localStorage.removeItem(
"CyberKnightSave"
);


location.reload();


}




loadGame();


</script>


</body>

</html>
