<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozy Forest Sanctuary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #F4F1EA;
            --earth-brown: #4A3E3D;
            --moss-green: #2C4A3E;
            --soft-amber: #D9A05B;
            --warm-orange: #E57C48;
            --leaf-light: #8FA89B;
            --card-bg: #FAF8F5;
            --transition-speed: 0.5s;
        }

        .twilight {
            --bg-cream: #1C2321;
            --earth-brown: #EAE3D2;
            --moss-green: #7D9D86;
            --soft-amber: #F2C14E;
            --warm-orange: #EE6C4D;
            --leaf-light: #3E504A;
            --card-bg: #252E2B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-cream);
            color: var(--earth-brown);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        /* Ambient Header */
        header {
            padding: 20px 24px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-title h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .status-title p {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .toggle-btn {
            background: var(--card-bg);
            border: 2px solid var(--earth-brown);
            padding: 8px 14px;
            border-radius: 20px;
            color: var(--earth-brown);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0 var(--earth-brown);
            transform: translateY(-2px);
            transition: all 0.1s ease;
        }

        .toggle-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0 var(--earth-brown);
        }

        /* Core Metrics Card */
        .metrics-container {
            padding: 0 24px;
            margin-bottom: 16px;
        }

        .metrics-card {
            background: var(--card-bg);
            border: 2px solid var(--earth-brown);
            border-radius: 24px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 6px 0 var(--earth-brown);
            transition: background-color var(--transition-speed);
        }

        .metric-item {
            text-align: center;
        }

        .metric-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .metric-value {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--moss-green);
            transition: color var(--transition-speed);
        }

        /* Main App View Window */
        .view-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            margin: 0 24px 24px;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: scale(0.96);
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        .screen.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* Screen Content */
        .screen h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .screen p {
            font-size: 1.05rem;
            line-height: 1.5;
            max-width: 280px;
            opacity: 0.9;
        }

        .illustration {
            font-size: 5rem;
            margin-bottom: 10px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Action Buttons */
        .action-btn {
            background: var(--moss-green);
            color: var(--bg-cream);
            border: 2px solid var(--earth-brown);
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--earth-brown);
            transform: translateY(-4px);
            transition: all 0.1s ease, background-color var(--transition-speed), color var(--transition-speed);
            margin-top: 10px;
            min-width: 200px;
        }

        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0 var(--earth-brown);
        }

        /* Bottom Thumb Nav Bar */
        nav {
            background: var(--card-bg);
            border-top: 2px solid var(--earth-brown);
            padding: 12px 24px calc(12px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-around;
            align-items: center;
            transition: background-color var(--transition-speed);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--earth-brown);
            opacity: 0.5;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            gap: 4px;
            transition: opacity 0.2s, transform 0.2s;
        }

        .nav-item.active {
            opacity: 1;
            transform: scale(1.08);
            color: var(--moss-green);
        }

        .nav-icon {
            font-size: 1.6rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="status-title">
            <h1 id="time-title">🌲 Afternoon Woods</h1>
            <p id="time-subtitle">Peaceful & quiet</p>
        </div>
        <button class="toggle-btn" onclick="toggleTwilight()">
            <span id="theme-icon">🌙</span> <span id="theme-text">Twilight</span>
        </button>
    </header>

    <div class="metrics-container">
        <div class="metrics-card">
            <div class="metric-item">
                <div class="metric-label">Warmth</div>
                <div class="metric-value" id="warmth-val">Cozy (65%)</div>
            </div>
            <div class="metric-item">
                <div class="metric-label">Steps Taken</div>
                <div class="metric-value" id="steps-val">1,240</div>
            </div>
        </div>
    </div>

    <div class="view-container" id="swipe-zone">
        <!-- Screen 1: Walk -->
        <div class="screen active" id="screen-walk">
            <div class="illustration">🌿</div>
            <h2>Wander Deeper</h2>
            <p>Listen to the crunch of dried leaves under your boots.</p>
            <button class="action-btn" onclick="takeStep()">Take a Step</button>
        </div>

        <!-- Screen 2: Campfire -->
        <div class="screen" id="screen-fire">
            <div class="illustration" id="fire-emoji">🔥</div>
            <h2>The Campfire</h2>
            <p>Stoke the logs to keep the gentle twilight chill at bay.</p>
            <button class="action-btn" onclick="stokeFire()">Add Kindling</button>
        </div>

        <!-- Screen 3: Journal -->
        <div class="screen" id="screen-journal">
            <div class="illustration">📔</div>
            <h2>Forest Journal</h2>
            <p>"Saw a deer grazing near the mossy clearing today."</p>
            <button class="action-btn" onclick="readLog()">Write Reflection</button>
        </div>
    </div>

    <nav>
        <button class="nav-item active" onclick="switchScreen('walk', this)">
            <span class="nav-icon">🌿</span>
            <span>Walk</span>
        </button>
        <button class="nav-item" onclick="switchScreen('fire', this)">
            <span class="nav-icon">🔥</span>
            <span>Campfire</span>
        </button>
        <button class="nav-item" onclick="switchScreen('journal', this)">
            <span class="nav-icon">📔</span>
            <span>Journal</span>
        </button>
    </nav>

    <script>
        let warmth = 65;
        let steps = 1240;
        let currentScreenIndex = 0;
        const screens = ['walk', 'fire', 'journal'];

        function toggleTwilight() {
            const isTwilight = document.body.classList.toggle('twilight');
            const title = document.getElementById('time-title');
            const subtitle = document.getElementById('time-subtitle');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');

            if (isTwilight) {
                title.innerText = "✨ Midnight Canopy";
                subtitle.innerText = "Stars peek through branches";
                themeIcon.innerText = "☀️";
                themeText.innerText = "Daylight";
            } else {
                title.innerText = "🌲 Afternoon Woods";
                subtitle.innerText = "Peaceful & quiet";
                themeIcon.innerText = "🌙";
                themeText.innerText = "Twilight";
            }
        }

        function switchScreen(screenId, navElement) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`screen-${screenId}`).classList.add('active');
            navElement.classList.add('active');
            
            currentScreenIndex = screens.indexOf(screenId);
        }

        function takeStep() {
            steps += Math.floor(Math.random() * 15) + 5;
            document.getElementById('steps-val').innerText = steps.toLocaleString();
            warmth = Math.max(20, warmth - 2);
            updateWarmthDisplay();
        }

        function stokeFire() {
            warmth = Math.min(100, warmth + 12);
            updateWarmthDisplay();
            const fire = document.getElementById('fire-emoji');
            fire.style.transform = 'scale(1.3)';
            setTimeout(() => fire.style.transform = 'none', 300);
        }

        function updateWarmthDisplay() {
            let label = "Chilly";
            if (warmth > 75) label = "Roasting";
            else if (warmth > 50) label = "Cozy";
            else if (warmth > 30) label = "Mild";
            document.getElementById('warmth-val').innerText = `${label} (${warmth}%)`;
        }

        function readLog() {
            const thoughts = [
                "Discovered a soft patch of wild clover.",
                "The smell of pine needles is crisp today.",
                "Heard an owl hoot softly in the distance.",
                "The stream water is freezing but clear."
            ];
            alert(thoughts[Math.floor(Math.random() * thoughts.length)]);
        }

        // Simple Mobile Swipe Gestures
        let touchstartX = 0;
        let touchendX = 0;
        const zone = document.getElementById('swipe-zone');

        zone.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        });

        zone.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleGesture();
        });

        function handleGesture() {
            if (touchstartX - touchendX > 60) {
                // Swipe Left -> Next Screen
                if (currentScreenIndex < screens.length - 1) {
                    const nextId = screens[currentScreenIndex + 1];
                    const navBtn = document.querySelectorAll('.nav-item')[currentScreenIndex + 1];
                    switchScreen(nextId, navBtn);
                }
            }
            if (touchendX - touchstartX > 60) {
                // Swipe Right -> Prev Screen
                if (currentScreenIndex > 0) {
                    const prevId = screens[currentScreenIndex - 1];
                    const navBtn = document.querySelectorAll('.nav-item')[currentScreenIndex - 1];
                    switchScreen(prevId, navBtn);
                }
            }
        }
    </script>
</body>
</html>
